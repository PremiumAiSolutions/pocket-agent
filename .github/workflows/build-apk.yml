name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: pocket-agent-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Keeps one "latest" release so the APK can be downloaded straight from a phone.
      - name: Publish latest build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk pocket-agent.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest pocket-agent.apk \
            --title "Latest build" \
            --notes "Built from commit ${GITHUB_SHA::7}" \
            --prerelease
